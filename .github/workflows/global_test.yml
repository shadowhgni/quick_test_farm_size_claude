name: Global accessibility - regional end-to-end test (Python 3.13)

on:
  push:
    branches: ['claude/**']
    paths:
      - 'global_accessibility/global_accessibility.py'
      - '.github/workflows/global_test.yml'
  workflow_dispatch:

concurrency:
  group: global-accessibility-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Environment
        run: |
          python --version; nproc; free -g; df -h .
          pip install pytest scikit-image   # only for the offline tests; the script installs its own packages
      - name: Run (bbox Benin/Togo and neighbours; script installs its own dependencies)
        run: |
          python global_accessibility/global_accessibility.py \
            --bbox -1 5.5 4.5 13.5 --start 2015 --end 2026 --routing-cities 12 \
            --ml-files Western_Africa.zip \
            --nelson-layers cities_11 cities_12 ports_5 \
            --work-dir ga_work --results-dir global_accessibility/test_results \
            2>&1 | tee run_stdout.txt
      - name: Offline unit tests (using the packages the script installed)
        if: always()
        run: |
          PYTHONPATH=ga_work/pylib python -m pytest global_accessibility/dev -q -p no:cacheprovider 2>&1 | tail -5 | tee -a run_stdout.txt
      - name: Result size
        if: always()
        run: du -sh global_accessibility/test_results/* 2>/dev/null; ls -la ga_work 2>/dev/null | head
      - name: Commit test results
        if: always()
        run: |
          mkdir -p global_accessibility/test_results
          cp run_stdout.txt global_accessibility/test_results/ || true
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add global_accessibility/test_results || true
          git diff --cached --quiet && exit 0
          git commit -m "ci: global_accessibility regional test [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
