name: Study workflow - access_effects_v01.py and estimate_effects.py tests

on:
  push:
    branches: ['claude/**']
    paths:
      - 'global_accessibility/study_workflow/**'
      - '.github/workflows/study_workflow_test.yml'
  workflow_dispatch:

concurrency:
  group: study-workflow-test
  cancel-in-progress: true

jobs:
  python:
    # what the HPC runs: pure Python, no R
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python packages
        run: pip install pytest numpy pandas geopandas pyogrio shapely rasterio pyproj scipy psutil requests pyarrow pyreadstat moderndid==0.4.1 pyfixest==0.60.0 statsmodels google-cloud-storage
      - name: Tests (no R installed; the parity tests are skipped)
        working-directory: global_accessibility/study_workflow
        run: timeout -s ABRT 50m python -X faulthandler -m pytest dev -q -p no:warnings

  parity:
    # Python estimates against the earlier R script (dev/reference_estimate_effects.R)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: R packages
        run: Rscript -e 'install.packages(c("dplyr","tidyr","readr","purrr","tibble","stringr","jsonlite","fixest","did","contdid","nanoparquet"))'
      - name: Python packages
        run: pip install pytest numpy pandas scipy pyarrow moderndid==0.4.1 pyfixest==0.60.0 statsmodels
      - name: Parity tests
        working-directory: global_accessibility/study_workflow
        env:
          REQUIRE_PARITY: '1'
        run: timeout -s ABRT 50m python -X faulthandler -m pytest dev/test_estimate_parity.py -q -p no:warnings
