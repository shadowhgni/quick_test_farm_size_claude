name: Study workflow - access_effects_v01.py and estimate_effects.R tests

on:
  push:
    branches: ['claude/**']
    paths:
      - 'global_accessibility/study_workflow/**'
      - '.github/workflows/study_workflow_test.yml'
  workflow_dispatch:

concurrency:
  group: study-workflow-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: R packages
        run: |
          Rscript -e 'install.packages(c("dplyr","tidyr","readr","purrr","tibble","stringr","jsonlite","fixest","did","contdid","nanoparquet"))'
          Rscript -e 'for (p in c("fixest","did","contdid","nanoparquet")) cat(p, requireNamespace(p, quietly = TRUE), "\n")'
      - name: Python packages
        run: pip install pytest numpy pandas geopandas pyogrio shapely rasterio pyproj scipy psutil requests pyarrow pyreadstat
      - name: Tests (regional store of the global test + synthetic inputs; R tests included)
        working-directory: global_accessibility/study_workflow
        run: timeout -s ABRT 50m python -X faulthandler -m pytest dev -q -p no:warnings
