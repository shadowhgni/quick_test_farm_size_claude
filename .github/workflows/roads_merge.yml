name: Roads merge (Benin + Togo)

on:
  push:
    branches: [main, 'claude/roaddetections-fork-test-*']
    paths:
      - 'roads_merge/**.py'
      - 'roads_merge/speed_table.csv'
      - 'roads_merge/requirements.txt'
      - '.github/workflows/roads_merge.yml'
  workflow_dispatch:

jobs:
  benin-togo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # commit results back
    defaults:
      run:
        working-directory: roads_merge

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'roads_merge/requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (synthetic data)
        run: python -m pytest tests -q

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: roads_merge/data
          key: roads-data-200101-260901-ms20250428

      - name: Download OSM snapshots + Microsoft roads
        run: |
          mkdir -p data && cd data
          get() { [ -s "$2" ] || curl -fsSL --retry 3 -o "$2" "$1"; }
          for c in benin togo; do
            for t in 200101 260901; do
              get "https://download.geofabrik.de/africa/$c-$t.osm.pbf" "$c-$t.osm.pbf"
            done
          done
          get "https://usaminedroads.z19.web.core.windows.net/drops/2025.04.28/Western_Africa.zip" Western_Africa.zip
          ls -lh

      - name: Copy RoadDetections images (reference only)
        run: |
          mkdir -p roaddetections_images && cd roaddetections_images
          for f in ARMP.Heatmap-v.2025.01.01.01.00.00.png scheme.png; do
            curl -fsSL --retry 3 -o "$f" "https://raw.githubusercontent.com/microsoft/RoadDetections/main/images/$f" || true
          done

      - name: Run Benin + Togo
        run: python run_benin_togo.py 2>&1 | tee run_stdout.txt

      - name: Upload large outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roads-benin-togo-run${{ github.run_number }}
          path: |
            roads_merge/output_benin_togo/
            roads_merge/results_benin_togo/
          retention-days: 30

      - name: Commit small results back
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results_benin_togo/ run_stdout.txt roaddetections_images/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "ci: roads merge Benin+Togo run #${{ github.run_number }} [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
